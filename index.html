<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🕒</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body {
    margin: 0;
    padding: 32px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
    text-align: center;
  }
  h2 { margin: 0 0 12px; }
  #tz { font-size: 20px; font-weight: 600; margin: 16px 0 4px; }
  #time { opacity: 0.7; margin-bottom: 24px; }
  #status { margin-top: 16px; opacity: 0.7; }
  button {
    font-size: 16px;
    padding: 12px 24px;
    border: 0;
    border-radius: 10px;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #ffffff);
  }
</style>
</head>
<body>
  <h2 id="title"></h2>
  <div id="tz"></div>
  <div id="time"></div>
  <button id="retry" style="display:none"></button>
  <div id="status"></div>

<script>
  // Тексти двома мовами. Мову передає бот в адресі (?lang=ua або ?lang=ru), інакше береться мова телефона.
  var TEXTS = {
    ua: {
      title: "🕒 Визначаємо час…",
      now: "Зараз у тебе: ",
      unknown: "не вдалося визначити",
      open_in_bot: "Відкрий цю сторінку кнопкою в боті.",
      no_tz: "Не вдалося визначити пояс. Повернись у бот і введи час вручну.",
      send_fail: "Не вдалося надіслати. Натисни кнопку ще раз.",
      retry: "Надіслати знову"
    },
    ru: {
      title: "🕒 Определяем время…",
      now: "Сейчас у тебя: ",
      unknown: "не удалось определить",
      open_in_bot: "Открой эту страницу кнопкой в боте.",
      no_tz: "Не получилось определить пояс. Вернись в бот и введи время вручную.",
      send_fail: "Не удалось отправить. Нажми кнопку ещё раз.",
      retry: "Отправить снова"
    }
  };

  var params = new URLSearchParams(window.location.search);
  var lang = (params.get("lang") || "").toLowerCase();
  if (lang !== "ua" && lang !== "ru") {
    var nav = (navigator.language || "").toLowerCase();
    lang = nav.indexOf("uk") === 0 ? "ua" : "ru";
  }
  var L = TEXTS[lang];
  document.documentElement.lang = lang === "ua" ? "uk" : "ru";

  var tg = window.Telegram && window.Telegram.WebApp;
  var tz = "";
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}

  document.getElementById("title").textContent = L.title;
  document.getElementById("tz").textContent = tz || L.unknown;
  document.getElementById("time").textContent =
    L.now + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  document.getElementById("retry").textContent = L.retry;

  function send() {
    var status = document.getElementById("status");
    // У Mini App, відкритих кнопкою клавіатури, initData порожній, тому перевіряємо платформу
    var insideTelegram = tg && tg.platform && tg.platform !== "unknown";
    if (!insideTelegram) {
      status.textContent = L.open_in_bot;
      return;
    }
    if (!tz) {
      status.textContent = L.no_tz;
      return;
    }
    try {
      tg.sendData(JSON.stringify({ tz: tz }));  // надсилає дані боту і закриває вікно
    } catch (e) {
      status.textContent = L.send_fail;
      document.getElementById("retry").style.display = "inline-block";
    }
  }

  document.getElementById("retry").onclick = send;

  if (tg) { tg.ready(); tg.expand(); }
  setTimeout(send, 900);
</script>
</body>
</html>
