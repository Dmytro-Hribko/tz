<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Часовой пояс</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body {
    margin: 0;
    padding: 32px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
    text-align: center;
  }
  h2 { margin: 0 0 12px; }
  #tz { font-size: 20px; font-weight: 600; margin: 16px 0 4px; }
  #time { opacity: 0.7; margin-bottom: 24px; }
  #status { margin-top: 16px; opacity: 0.7; }
  button {
    font-size: 16px;
    padding: 12px 24px;
    border: 0;
    border-radius: 10px;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #ffffff);
  }
</style>
</head>
<body>
  <h2>🕒 Определяем время…</h2>
  <div id="tz"></div>
  <div id="time"></div>
  <button id="retry" style="display:none">Отправить снова</button>
  <div id="status"></div>

<script>
  var tg = window.Telegram && window.Telegram.WebApp;
  var tz = "";
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}

  document.getElementById("tz").textContent = tz || "не удалось определить";
  document.getElementById("time").textContent =
    "Сейчас у тебя: " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

  function send() {
    var status = document.getElementById("status");
    if (!tg || !tg.initData) {
      status.textContent = "Открой эту страницу кнопкой в боте.";
      return;
    }
    if (!tz) {
      status.textContent = "Не получилось определить пояс. Вернись в бот и введи время вручную.";
      return;
    }
    try {
      tg.sendData(JSON.stringify({ tz: tz }));  // отправляет данные боту и закрывает окно
    } catch (e) {
      status.textContent = "Не удалось отправить. Нажми кнопку ещё раз.";
      document.getElementById("retry").style.display = "inline-block";
    }
  }

  document.getElementById("retry").onclick = send;

  if (tg) { tg.ready(); tg.expand(); }
  setTimeout(send, 900);
</script>
</body>
</html>
